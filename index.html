<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Paper · III B.Com solved papers</title>
<meta name="description" content="Solved papers and question papers for III B.Com, Davangere University: all seven subjects, ready to view, download and print.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23234fbf'/%3E%3Cpath d='M10 8h9l4 4v12H10z' fill='%23fff'/%3E%3Cpath d='M13 15h7M13 18.5h7M13 22h4' stroke='%23234fbf' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="site/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to the papers</a>

<header class="top">
  <div class="wrap top__row">
    <a class="mark" href="#/">
      <svg aria-hidden="true" viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M10 8h9l4 4v12H10z" fill="#fff"/><path d="M13 15h7M13 18.5h7M13 22h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Exam Paper</span>
    </a>
    <span class="top__right">
      <span class="top__meta">III B.Com · Davangere University</span>
      <button type="button" class="bell" id="bell" hidden aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span id="bell-label">Alert me</span>
      </button>
    </span>
  </div>
</header>

<main id="main" class="wrap" tabindex="-1">
  <noscript><p class="notice">This page needs JavaScript to list the papers. The files are also on <a href="https://github.com/abuzar310/exam-paper/tree/main/papers">GitHub</a>.</p></noscript>
  <div id="view" aria-live="polite"><p class="loading">Loading the papers…</p></div>
</main>

<footer class="foot">
  <div class="wrap foot__row">
    <p>Made by Abuzar for III B.Com, Don Bosco College, Chitradurga.</p>
    <p id="built"></p>
  </div>
</footer>

<dialog id="viewer" class="viewer" aria-label="Page image">
  <div class="viewer__bar">
    <p id="viewer-caption" class="viewer__caption"></p>
    <a id="viewer-dl" class="viewer__link">Download PNG</a>
    <a id="viewer-open" class="viewer__link" target="_blank" rel="noopener">Open full size</a>
    <button type="button" class="viewer__close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="viewer__stage">
    <button type="button" class="viewer__nav" data-step="-1" aria-label="Previous page">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img id="viewer-img" alt="">
    <button type="button" class="viewer__nav" data-step="1" aria-label="Next page">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</dialog>

<button type="button" class="fab" id="fab" aria-haspopup="dialog" aria-controls="upload">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  <span class="fab__label">Add a paper</span>
</button>

<dialog id="upload" class="sheet" aria-labelledby="upload-title">
  <form id="upload-form" method="dialog" novalidate>
    <div class="sheet__head">
      <h2 id="upload-title">Add a question paper</h2>
      <button type="button" class="sheet__close" data-close-upload aria-label="Close">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="sheet__lead">Photograph every page, in order. Hold the phone straight over the paper, in good light.</p>

    <div class="shots" id="shots" aria-live="polite"></div>
    <div class="actions">
      <label class="btn btn--primary">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span id="take-label">Take photo</span>
        <input type="file" accept="image/*" capture="environment" id="take" class="sr-only">
      </label>
      <label class="btn">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 16l4.5-4.5 3.5 3.5 2.5-2.5L20 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        From gallery
        <input type="file" accept="image/*" multiple id="pick" class="sr-only">
      </label>
    </div>

    <div class="field">
      <label for="up-subject">Subject</label>
      <select id="up-subject" required></select>
    </div>
    <div class="field">
      <label for="up-note">Which exam? <span class="field__hint">(optional)</span></label>
      <input id="up-note" type="text" maxlength="200" placeholder="e.g. Model exam, 12 November" autocomplete="off">
    </div>

    <p class="sheet__status" id="up-status" role="status"></p>
    <button type="submit" class="btn btn--primary btn--wide" id="up-send" disabled>Upload</button>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="site/app.js" defer></script>
</body>
</html>
